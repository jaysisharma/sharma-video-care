name: sharma_video_care_mobile
description: "Sharma Video Care Mobile App for iOS and Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  flutter_bloc: ^8.1.6
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.0
  image_picker: ^1.1.2
  http: ^1.2.2
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10
  firebase_app_check: ^0.3.2+10
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/services/
