name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"
      split_per_abi:
        description: "Split APK per ABI (arm64-v8a, armeabi-v7a, x86_64)"
        required: false
        default: false
        type: boolean
      run_tests:
        description: "Run flutter analyze & tests before building"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.0" # keep in step with the version used locally
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Environment
        run: |
          echo "Flutter version:"
          flutter --version
          echo "Java version:"
          java -version

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run Flutter Analyzer
        if: ${{ github.event.inputs.run_tests != 'false' }}
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        if: ${{ github.event.inputs.run_tests != 'false' }}
        working-directory: apps/mobile
        run: flutter test

      # Optional: Decode production signing key if secrets are configured in GitHub repository
      - name: Configure Signing Keystore (Optional)
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore configured successfully."
          else
            echo "No signing keystore secret found. Android build will use default debug signing."
          fi

      - name: Build APK
        working-directory: apps/mobile
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          SPLIT_ABI="${{ github.event.inputs.split_per_abi }}"
          
          FLAGS="--$BUILD_TYPE"
          if [ "$SPLIT_ABI" = "true" ]; then
            FLAGS="$FLAGS --split-per-abi"
          fi
          
          echo "Executing: flutter build apk $FLAGS"
          flutter build apk $FLAGS

      - name: Inspect Generated APKs
        run: |
          echo "Listing generated APK files:"
          ls -lh apps/mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type || 'release' }}-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
